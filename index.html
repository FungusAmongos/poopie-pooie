<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poopie Pooie</title>
<style>
body{margin:0;font:16px system-ui;background:#171226;color:#fff}.wrap{max-width:980px;margin:auto;padding:32px 20px}.hero{background:linear-gradient(135deg,#ffcf56,#ff7aa8);color:#24152b;border-radius:28px;padding:28px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-top:18px}.card{background:#251b3b;border:1px solid #453768;border-radius:22px;padding:22px}.big{font-size:64px;font-weight:800}.btn{background:#70e1b3;color:#172117;border:0;padding:14px 18px;border-radius:14px;font-weight:800;cursor:pointer}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #41365b}.muted{color:#bdb4d4}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
<section class="hero"><div class="muted">A totally serious wellness game</div><h1>💩 Poopie Pooie</h1><p>Log your daily poops, keep a streak, and climb the leaderboard. Nicknames only. No medical data.</p><button class="btn" id="log">+ Log a poop</button></section>
<section class="grid"><article class="card"><div class="muted">Your count today</div><div class="big" id="count">0</div><div class="muted" id="streak">Streak: 0 days</div><p id="badge">Badge: Fresh start 🌱</p></article><article class="card"><h2>🏆 Leaderboard</h2><div class="row"><span>1. Poo-nicorn</span><b>42</b></div><div class="row"><span>2. Captain Crap</span><b>31</b></div><div class="row"><span>3. You</span><b id="you">0</b></div><p class="muted">Leaderboard is demo data for now.</p></article></section>
</main>
<script>let n=0;document.querySelector('#log').onclick=()=>{n++;document.querySelector('#count').textContent=n;document.querySelector('#you').textContent=n;document.querySelector('#streak').textContent='Streak: '+Math.min(n,7)+' days';document.querySelector('#badge').textContent='Badge: '+(n>=5?'Poop Pro 🏅':n>=3?'Regular 💩':'Fresh start 🌱')}</script>
</body></html>
